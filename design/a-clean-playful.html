<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A · 깔끔한 장난감</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  /* 색은 3가지로 통일: 코랄(메인) · 하늘(보조) · 해바라기(포인트) */
  :root { --coral: #FF6B8A; --coral-d: #E04A6C; --coral-l: #FFE3EA; --sky: #4DA8FF; --sky-d: #2E86E0; --sky-l: #E1F0FF;
          --sun: #FFC23D; --sun-d: #E9A10F; --sun-l: #FFF2CF; --ink: #3A2E4F; --ink-2: #8B809C; --bg: #FFF9F3; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Jua', sans-serif; color: var(--ink); background: radial-gradient(1200px 500px at 70% -10%, #DDF0FF 0%, transparent 70%), var(--bg); height: 100vh; overflow: hidden; padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; }
  .en { font-family: 'Fredoka', sans-serif; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top .sp { flex: 1; }
  .pill { background: #fff; border-radius: 999px; padding: 10px 20px; font-size: 22px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 0 #EFE6DD; }
  .gear { width: 60px; height: 60px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 #EFE6DD; }
  .hero { display: flex; align-items: center; gap: 18px; }
  .bubble { background: #fff; border-radius: 28px; padding: 18px 26px; font-size: 30px; position: relative; box-shadow: 0 5px 0 #EFE6DD; }
  .bubble::before { content: ''; position: absolute; left: -14px; bottom: 28px; border: 14px solid transparent; border-right-color: #fff; border-left: 0; }
  .bubble small { display: block; font-size: 20px; color: var(--ink-2); margin-top: 4px; }
  .level { margin-left: auto; background: #fff; border-radius: 28px; padding: 18px 24px; min-width: 270px; box-shadow: 0 5px 0 #EFE6DD; }
  .level b { font-family: 'Fredoka'; font-size: 32px; color: var(--sky-d); }
  .bar { height: 16px; background: var(--sky-l); border-radius: 99px; margin: 8px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 75%; border-radius: 99px; background: var(--sky); }
  .level span { font-size: 18px; color: var(--ink-2); }
  .lesson { display: flex; align-items: center; gap: 24px; background: var(--coral); color: #fff; border-radius: 36px; padding: 22px 30px; box-shadow: 0 8px 0 var(--coral-d); position: relative; overflow: hidden; }
  .lesson::after { content: ''; position: absolute; right: -60px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .lesson .art { width: 104px; height: 104px; border-radius: 30px; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
  .lesson .t1 { font-family: 'Fredoka'; font-size: 21px; opacity: .9; }
  .lesson .t2 { font-size: 40px; line-height: 1.15; }
  .lesson .play { margin-left: auto; width: 96px; height: 96px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 var(--coral-d); position: relative; z-index: 1; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .tile { position: relative; background: #fff; border-radius: 30px; padding: 18px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 6px 0 #EFE6DD; font-size: 23px; }
  .tile .ic { width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center; }
  .tile .en { font-size: 16px; color: var(--ink-2); }
  .tile .today { position: absolute; top: -9px; right: -6px; background: var(--sun); color: var(--ink); font-size: 16px; padding: 4px 12px; border-radius: 99px; box-shadow: 0 3px 0 var(--sun-d); }
  .week { display: flex; gap: 10px; background: #fff; border-radius: 28px; padding: 12px 16px; box-shadow: 0 5px 0 #EFE6DD; }
  .week div { flex: 1; text-align: center; font-size: 18px; color: var(--ink-2); border-radius: 18px; padding: 6px 0; }
  .week div.now { background: var(--coral-l); color: var(--ink); }
  .week .dot { height: 40px; display: grid; place-items: center; }
  .week .dot i { width: 12px; height: 12px; border-radius: 50%; background: #EADFF0; display: block; }
</style></head>
<body>
<script src="shared.js"></script>
<script>
const pal = { coral: ['#FF6B8A', '#E04A6C', '#FFE3EA'], sky: ['#4DA8FF', '#2E86E0', '#E1F0FF'], sun: ['#FFC23D', '#E9A10F', '#FFF2CF'] };
const order = ['coral', 'sky', 'sun'];
document.body.innerHTML = `
  <div class="top"><div class="pill">${icon('sun', 28, '#FFC23D', '#FF9F1C', '#FFF2CF')} ${MOCK.streak}일 연속</div><div class="sp"></div>
    <div class="pill">${icon('sticker', 28, '#FFC23D', '#E9A10F', '#fff')} <b class="en">${MOCK.stars}</b></div><div class="gear">${icon('gear', 30, '#B9AECB')}</div></div>
  <div class="hero">${jenny(150)}
    <div class="bubble"><span class="en">Hi, ${MOCK.name}! Let's play!</span><small>안녕 나현! 오늘도 같이 놀자!</small></div>
    <div class="level"><b>Level ${MOCK.level}</b><div class="bar"><i></i></div><span>다음 레벨까지 별 ${MOCK.toNext}개</span></div></div>
  <div class="lesson"><div class="art">${icon('sun', 76, '#FFD45C', '#FFF1C2', '#FFF8E0')}</div>
    <div><div class="t1">Day ${MOCK.day} · ${MOCK.stage}</div><div class="t2">${MOCK.lessonKo}</div><div class="t1">${MOCK.lessonEn}</div></div>
    <div class="play">${icon('play', 44, '#FF6B8A')}</div></div>
  <div class="tiles">${MOCK.tiles.map(([k, ko, en, t], i) => { const [c, d, l] = pal[order[i % 3]];
    return `<div class="tile">${t ? '<span class="today">오늘!</span>' : ''}<div class="ic" style="background:${l}">${icon(k, 58, c, d, '#fff')}</div>${ko}<span class="en">${en}</span></div>`; }).join('')}</div>
  <div class="week">${MOCK.week.map((d, i) => `<div class="${i === MOCK.todayIdx ? 'now' : ''}"><div class="dot">${MOCK.done[i] ? icon('carrot', 36, '#FF9A3C', '#4CC38A', '#FFD3A8') : '<i></i>'}</div>${d}</div>`).join('')}</div>`;
</script>
</body></html>
